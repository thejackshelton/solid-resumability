      A synthetic page, shaped like the pages this rewriter serves: one entry

      component's emitted markup, and one root element that a captured build
      fills with a first paint. Both are empty here, which is how a source
      document states them.
    -->
    <main class="page">
      <div class="mount" data-component="ShelfToolbar" data-resume="shelf-page.ShelfToolbar"></div>
      <div class="shelf" id="page-root"></div>
    </main>
    <script type="module" src="/src/pages/shelf-classic.ts"></script>
  </body>
